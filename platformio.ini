; CYD (ESP32-2432S028R) Web Radio
[platformio]
default_envs = cyd          ; 通常のビルド/アップロードは cyd だけ

[env:cyd]
platform = espressif32@6.5.0      ; Arduino-ESP32 2.x (内蔵DAC出力に必要)
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
build_src_filter = +<*> -<noise_test.cpp>
extra_scripts = pre:patch_audio.py   ; ライブラリに再生前のプリバッファを追加するパッチ
board_build.partitions = huge_app.csv   ; 日本語フォントでフラッシュを使うため大きめ

lib_deps =
    lovyan03/LovyanGFX@^1.2.0
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
    https://github.com/schreibfaul1/ESP32-audioI2S.git#2.0.6

build_flags =
    -DCORE_DEBUG_LEVEL=0
    ; 受信できない局を調べるときは、上の行を消して次の2行を有効にする
    ;-DCORE_DEBUG_LEVEL=3
    ;-DAUDIO_LOG

; ノイズ診断用 (VS Code 下部のステータスバーで env:noise_test を選んで書き込む)
[env:noise_test]
extends = env:cyd
build_src_filter = -<*> +<noise_test.cpp>
